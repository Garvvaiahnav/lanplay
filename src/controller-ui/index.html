<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws: wss:; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LanPlay">
  <title>LanPlay Controller</title>
  <link rel="icon" href="data:,">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="controller.css">
  <script src="controller.js" defer></script>
</head>
<body>
  <noscript><p class="noscript">LanPlay Controller needs JavaScript.</p></noscript>

  <!-- Every control is drawn here from the active layout (src/core/controller/layout.ts), so this stays empty in the markup. -->
  <main id="field" class="field" aria-label="Game controller"></main>

  <!-- The only chrome in play: one button at the top centre. The dot shows the connection (green, amber, red) and the player slot. -->
  <button type="button" id="menu" class="menu" aria-label="Menu" data-state="connecting">
    <svg class="gear" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle class="gear-teeth" cx="12" cy="12" r="7.6"></circle>
      <circle class="gear-ring" cx="12" cy="12" r="5.4"></circle>
      <circle class="gear-hub" cx="12" cy="12" r="1.8"></circle>
    </svg>
    <span class="menu-label"><span class="menu-dot" aria-hidden="true">●</span> <span id="menu-slot">P?</span></span>
  </button>
  <button type="button" id="done" class="done" hidden>Done</button>

  <!-- The editor surface: Size and Opacity for a selected control, or the settings when nothing is selected. -->
  <div id="card" class="card" role="group" aria-label="Layout editor" hidden></div>

  <div id="notice" class="overlay" role="alert" hidden>
    <p id="notice-text" class="overlay-title"></p>
    <button type="button" id="retry" class="action" hidden>Try again</button>
  </div>

  <div id="rotate" class="overlay rotate-overlay">
    <div class="phone-icon" aria-hidden="true"></div>
    <p class="overlay-title">Rotate your phone</p>
    <p class="overlay-sub">Hold it sideways to use the controller.</p>
  </div>
</body>
</html>
